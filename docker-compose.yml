services:
  fxvpn-webui:
    build: .
    image: fxvpn-webui:latest
    container_name: fxvpn-webui
    restart: unless-stopped
    ports:
      - "9090:9090"   # Web console
      - "1080:1080"   # SOCKS5 proxy (bound by the web console after you pick a server)
    environment:
      WEBUI_ADDR: ":9090"
      SOCKS_ADDR: "0.0.0.0:1080"     # reachable from other devices
      GUARDIAN_ENDPOINT: "https://vpn.mozilla.org"
      STATE_FILE: "/data/state.json"
      # Key for the PC-browser capture path: the userscript in your browser
      # posts tokens to /api/ingest with this key. Set it to enable.
      FXVPN_INGEST_KEY: "4296ebfdf56e755f22721060cc089af50e25febbf09f0659"
    volumes:
      - fxvpn-data:/data
    # Extra shm for a headless browser is no longer needed; keep a modest size.
    shm_size: "128m"

volumes:
  fxvpn-data:
