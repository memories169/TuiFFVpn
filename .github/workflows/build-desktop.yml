name: build-desktop

# Build the native desktop app (fxvpn-desktop) for Linux, Windows and macOS
# on every push to main, on version tags, and on manual dispatch. Binaries
# are attached to GitHub Releases for tag builds; main builds produce
# download artifacts.
#
# Jobs:
#   linux-amd64 / linux-arm64 — native builds on Ubuntu runners (glibc
#                                2.35 baseline), plus a linuxdeploy AppImage
#   windows-amd64             — pure-Go cross-ish build: Gio's Windows
#                               backend needs no cgo, built with nometal
#   darwin (amd64+arm64)      — MUST run on macOS runners: the Metal GL
#                               backend is cgo against Apple frameworks, so
#                               it cannot be cross-compiled from Linux

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # release upload for tag builds

env:
  GO_VERSION: "1.22"
  PKG: ./webui/desktop/cmd/fxvpn-desktop

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Native build needs the Wayland/X11/xkbcommon/GL dev headers.
      # libgles2-dev no longer exists on newer Debian/Ubuntu (merged into
      # libgles-dev); the generic libgl-dev provides the OpenGL ES dev files.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxfixes-dev \
            libgl-dev libegl-dev libvulkan-dev

      - name: Vet
        run: go vet ./webui/...

      - name: Run Go tests
        run: go test -count=1 ./webui/...

      - name: Build fxvpn-desktop (linux-${{ matrix.arch }})
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME:-dev}-${GITHUB_SHA::7}" \
            -o fxvpn-desktop-linux-${{ matrix.arch }} ${{ env.PKG }}

      - name: Smoke test (binary runs, prints version)
        run: ./fxvpn-desktop-linux-${{ matrix.arch }} --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fxvpn-desktop-linux-${{ matrix.arch }}
          path: fxvpn-desktop-linux-${{ matrix.arch }}
          retention-days: 14

  appimage:
    # AppImage: single-file, distro-agnostic Linux build. Bundles the
    # required shared libraries so it runs even where the dev libs above
    # were never installed (only a working display session is needed).
    name: appimage-amd64
    runs-on: ubuntu-22.04
    needs: linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libx11-xcb-dev libxcursor-dev libxfixes-dev \
            libgl-dev libegl-dev libvulkan-dev \
            file desktop-file-utils

      - name: Build binary
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME:-dev}-${GITHUB_SHA::7}" \
            -o fxvpn-desktop ${{ env.PKG }}

      - name: Download linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps
          cp fxvpn-desktop AppDir/usr/bin/
          cat > AppDir/usr/share/applications/fxvpn.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=fxvpn — Firefox VPN
          Comment=Firefox VPN console (SOCKS5 over MASQUE)
          Exec=fxvpn-desktop
          Icon=fxvpn
          Categories=Network;
          EOF
          # Placeholder icon (256x256 PNG) — replace with a real one when
          # available; AppImage requires *some* icon to be valid.
          python3 - <<'PY'
          import struct, zlib
          w = h = 256
          raw = b''.join(b'\x00' + bytes([0x24, 0x27, 0x3a]) * w for _ in range(h))
          def chunk(t, d):
              c = t + d
              return struct.pack('>I', len(d)) + c + struct.pack('>I', zlib.crc32(c))
          ihdr = struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')
          open('AppDir/usr/share/icons/hicolor/256x256/apps/fxvpn.png', 'wb').write(png)
          PY
          # AppStream metadata (optional but linuxdeploy warns without it).
          mkdir -p AppDir/usr/share/metainfo
          cat > AppDir/usr/share/metainfo/fxvpn.appdata.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>com.fxvpn.desktop</id>
            <name>fxvpn</name>
            <summary>Firefox VPN console (SOCKS5 over MASQUE)</summary>
            <metadata_license>FSFAP</metadata_license>
            <project_license>GPL-3.0-only</project_license>
            <launchable type="desktop-id">fxvpn.desktop</launchable>
          </component>
          EOF

      - name: Build AppImage
        run: |
          # linuxdeploy names the output after the desktop file basename
          # ("fxvpn-<version>-x86_64.AppImage"), not after Exec= — don't
          # hardcode the name, pick up whatever single AppImage appeared.
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
          ls -la *.AppImage
          out=$(ls fxvpn-*.AppImage x86_64*.AppImage *.AppImage 2>/dev/null | head -1)
          if [ -z "$out" ]; then
            echo "::error::linuxdeploy produced no AppImage"
            exit 1
          fi
          mv "$out" fxvpn-desktop-x86_64.AppImage

      - name: Smoke test AppImage
        run: |
          chmod +x fxvpn-desktop-x86_64.AppImage
          ./fxvpn-desktop-x86_64.AppImage --appimage-extract-and-run --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fxvpn-desktop-x86_64.AppImage
          path: fxvpn-desktop-x86_64.AppImage
          retention-days: 14

  windows:
    # Gio's Windows backend (DirectX/GL via win32 syscalls) is pure Go —
    # no cgo toolchain needed. Built with the nometal tag (Metal is macOS
    # only); CGO stays off exactly like the container build.
    name: windows-amd64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Vet (windows target)
        run: |
          CGO_ENABLED=0 GOOS=windows go vet ${{ env.PKG }}

      - name: Run Go tests (host, no cgo)
        run: go test -count=1 ./webui/bridge/... ./webui/cmd/... ./webui/internal/...

      - name: Build fxvpn-desktop.exe (windows-amd64)
        run: |
          CGO_ENABLED=0 GOOS=windows go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME:-dev}-${GITHUB_SHA::7}" \
            -o fxvpn-desktop-windows-amd64.exe ${{ env.PKG }}

      - name: Smoke test (binary structure)
        run: |
          test "$(head -c 2 fxvpn-desktop-windows-amd64.exe)" = "MZ"
          ls -la fxvpn-desktop-windows-amd64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fxvpn-desktop-windows-amd64
          path: fxvpn-desktop-windows-amd64.exe
          retention-days: 14

  macos:
    # macOS builds MUST run on a mac runner: Gio's Metal GL backend is cgo
    # against Apple's frameworks, which cannot be cross-compiled from Linux.
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-13 # Intel
          - arch: arm64
            runner: macos-14 # Apple Silicon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Vet
        run: go vet ${{ env.PKG }}

      - name: Run Go tests (host, no cgo)
        run: go test -count=1 ./webui/bridge/... ./webui/cmd/... ./webui/internal/...

      - name: Build fxvpn-desktop (macos-${{ matrix.arch }})
        run: |
          go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_REF_NAME:-dev}-${GITHUB_SHA::7}" \
            -o fxvpn-desktop-macos-${{ matrix.arch }} ${{ env.PKG }}

      - name: Smoke test (binary runs, prints version)
        run: ./fxvpn-desktop-macos-${{ matrix.arch }} --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fxvpn-desktop-macos-${{ matrix.arch }}
          path: fxvpn-desktop-macos-${{ matrix.arch }}
          retention-days: 14

  release:
    # Attach all binaries to the GitHub Release for tag builds (v*).
    name: release
    runs-on: ubuntu-latest
    needs: [linux, appimage, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
