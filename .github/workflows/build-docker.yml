name: build-docker

# Build the Docker image and publish it to GHCR on every push to main,
# on tag pushes (v*), and on manual dispatch. PRs build without publishing.

on:
  # Manual and version-tag builds only — regular commits to main do NOT
  # publish images. Run from the Actions tab ("Run workflow"); on PRs it
  # builds without publishing.
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go unit tests run before the image build — fail fast on bad code.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # go.mod declares go 1.21 (the desktop GUI's Gio requires it);
          # the container binaries compile CGO_ENABLED=0 and never link Gio.
          go-version: "1.22"
          cache: true

      - name: Run Go tests
        # webui/desktop (the Gio GUI) compiles only with Wayland/X11 dev
        # headers via cgo and ships no tests — it is covered by its own
        # native CI job in build-desktop.yml. Everything else tests here
        # with zero cgo, exactly like the container build.
        run: go test -count=1 ./webui/bridge/... ./webui/cmd/... ./webui/internal/...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # branch name for main builds: ghcr.io/user/repo:main
            type=ref,event=branch
            # semver tags for v1.2.3 pushes: :1.2.3 :1.2 :1 + :latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # short SHA for every build: :sha-abc1234
            type=sha,prefix=sha-
            # latest only on main and version tags
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: echo "Published ${{ fromJSON(steps.meta.outputs.json).tags[0] }} @ ${{ steps.meta.outputs.digest }}"
